name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with requires-python in pyproject.toml and the flake.
  PYTHON_VERSION: "3.15"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Only ruff is needed here, at the version pinned in requirements.txt.
      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' requirements.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

  test:
    name: Tests and CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # Pinned tool versions from requirements.txt, plus the package itself,
      # so the build and the `apparel` entry point are exercised too.
      - name: Install
        run: python -m pip install -r requirements.txt .

      - name: Test
        run: pytest -q

      - name: Smoke test installed CLI
        run: |
          apparel --version
          apparel help convert > /dev/null
          apparel prices --list > /dev/null

  no-order-data:
    name: No order data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Order CSVs hold personal data; only the blank template may be tracked.
      - name: Check tracked CSV files
        run: |
          unexpected=$(git ls-files '*.csv' ':!:src/tsi_apparel/data/order_schema.csv')
          if [ -n "$unexpected" ]; then
            echo "::error::CSV files must not be committed (they may contain personal data):"
            echo "$unexpected"
            exit 1
          fi
